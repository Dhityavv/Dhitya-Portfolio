<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>All Projects - Dhitya Nurhadi</title>
<meta name="color-scheme" content="dark">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/projects.css">
</head>
<body class="projects-page">
<nav class="archive-nav"><div class="wrap">
  <a class="logo" href="index.html">Dhitya Nurhadi</a>
  <a class="archive-back" href="index.html#karya"><span aria-hidden="true">←</span> Portfolio</a>
</div></nav>

<main class="archive-main wrap">
  <header class="archive-heading">
    <div class="archive-heading-copy">
      <p class="archive-eyebrow">PORTFOLIO <span>—</span> 2026</p>
      <h1>All projects<span class="archive-period">.</span></h1>
      <p class="archive-description">Selected 3D modeling and animation projects.</p>
    </div>
    <p class="archive-total"><strong data-project-total>02</strong><span>PROJECTS</span></p>
  </header>

  <div class="project-toolbar">
    <div class="project-filters" role="group" aria-label="Filter projects">
      <button class="filter-option" type="button" data-filter="all" aria-pressed="true">All <span data-filter-count="all">02</span></button>
      <button class="filter-option" type="button" data-filter="3d-modeling" aria-pressed="false">Modeling <span data-filter-count="3d-modeling">02</span></button>
      <button class="filter-option" type="button" data-filter="animation" aria-pressed="false">Animation <span data-filter-count="animation">02</span></button>
      <button class="filter-option" type="button" data-filter="upcoming" aria-pressed="false">Upcoming <span data-filter-count="upcoming">02</span></button>
    </div>
    <p class="filter-result" aria-live="polite">Showing 2 projects</p>
  </div>

  <section class="project-gallery" aria-label="All projects">
    <button class="gallery-card art-one" type="button"
      data-title="Project 01" data-category="3D Modeling" data-year="2026" data-status="upcoming"
      data-description="This project is in progress. A project overview and related files will be shared when it is ready."
      data-role="Modeling · Environment" data-image="" data-source="">
      <span class="gallery-art" aria-hidden="true"><span class="art-orbit"></span><span class="art-object"></span><span class="art-glint"></span></span>
      <span class="gallery-card-info"><span class="gallery-card-number">01 / 2026 · UPCOMING</span><span class="gallery-card-title">Project 01</span><span class="gallery-card-type">3D Modeling <span aria-hidden="true">↗</span></span></span>
    </button>
    <button class="gallery-card art-two" type="button"
      data-title="Project 02" data-category="Animation" data-year="2026" data-status="upcoming"
      data-description="This project is in progress. A project overview and related files will be shared when it is ready."
      data-role="Animation · Lighting" data-image="" data-source="">
      <span class="gallery-art" aria-hidden="true"><span class="art-orbit"></span><span class="art-object"></span><span class="art-glint"></span></span>
      <span class="gallery-card-info"><span class="gallery-card-number">02 / 2026 · UPCOMING</span><span class="gallery-card-title">Project 02</span><span class="gallery-card-type">Animation <span aria-hidden="true">↗</span></span></span>
    </button>
  </section>

  <section class="project-list" aria-label="Projects in list view">
    <button class="project-row" type="button"
      data-title="Project 01" data-category="3D Modeling" data-year="2026" data-status="upcoming"
      data-description="This project is in progress. A project overview and related files will be shared when it is ready."
      data-role="Modeling · Environment" data-image="" data-source="">
      <span class="project-number">01</span>
      <span class="project-info"><span class="project-title">Project 01</span><span class="project-subtitle">3D Modeling · 2026 · Upcoming</span></span>
      <span class="project-open" aria-hidden="true">↗</span>
    </button>
    <button class="project-row" type="button"
      data-title="Project 02" data-category="Animation" data-year="2026" data-status="upcoming"
      data-description="This project is in progress. A project overview and related files will be shared when it is ready."
      data-role="Animation · Lighting" data-image="" data-source="">
      <span class="project-number">02</span>
      <span class="project-info"><span class="project-title">Project 02</span><span class="project-subtitle">Animation · 2026 · Upcoming</span></span>
      <span class="project-open" aria-hidden="true">↗</span>
    </button>
  </section>

  <footer class="archive-footer"><a href="index.html">← Back to portfolio</a><span>Dhitya Nurhadi · 2026</span></footer>
</main>

<div class="view-switch" role="group" aria-label="Project view">
  <button type="button" class="view-option" data-view="gallery" aria-pressed="true" aria-label="Gallery view"><span aria-hidden="true">▦</span><span>Gallery</span></button>
  <button type="button" class="view-option" data-view="list" aria-pressed="false" aria-label="List view"><span aria-hidden="true">☷</span><span>List</span></button>
</div>

<dialog class="project-dialog" aria-labelledby="dialog-title">
  <div class="dialog-shell">
    <div class="dialog-topbar">
      <span class="dialog-label">PROJECT DETAILS</span>
      <button class="dialog-close" type="button" aria-label="Close project details">Close <span aria-hidden="true">×</span></button>
    </div>
    <div class="dialog-art" aria-label="Project artwork">
      <img class="dialog-image" alt="" hidden>
      <div class="dialog-art-placeholder"><span>ARTWORK<br>PREVIEW</span></div>
      <span class="dialog-art-index"></span>
    </div>
    <div class="dialog-content">
      <div>
        <p class="dialog-meta"></p>
        <h2 id="dialog-title"></h2>
        <p class="dialog-description"></p>
      </div>
      <div class="dialog-role-wrap"><span>ROLE / FOCUS</span><p class="dialog-role"></p></div>
    </div>
    <div class="dialog-actions">
      <a class="btn dialog-source" href="" target="_blank" rel="noopener noreferrer" hidden>View source <span aria-hidden="true">↗</span></a>
      <span class="dialog-source-unavailable">Source not shared yet</span>
    </div>
  </div>
</dialog>
<script src="js/projects.js"></script>
</body>
</html>
